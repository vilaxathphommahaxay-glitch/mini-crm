server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Attachments are limited to 10 MB by the API (MAX_UPLOAD_MB), plus room for the form
    # envelope. CSV imports have their own 1 MB limit in the API.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # not in nginx's default mime.types; browsers expect this type for the app manifest
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # nginx only inherits add_header from the server block when a location sets none,
    # so the shared headers live in one snippet that every location includes.

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets never change, so cache them for a long time.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
        add_header Cache-Control "public, immutable";
        expires 1y;
        try_files $uri =404;
    }

    # Single-page app: unknown paths serve index.html and React Router takes over.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
