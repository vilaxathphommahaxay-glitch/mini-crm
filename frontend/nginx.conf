server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # CSV imports are limited to 1 MB by the API; leave a little room for the form envelope.
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # nginx only inherits add_header from the server block when a location sets none,
    # so the shared headers live in one snippet that every location includes.

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets never change, so cache them for a long time.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
        add_header Cache-Control "public, immutable";
        expires 1y;
        try_files $uri =404;
    }

    # Single-page app: unknown paths serve index.html and React Router takes over.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
