server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # CSV imports are limited to 1 MB by the API; leave a little room for the form envelope.
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets never change, so cache them for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths serve index.html and React Router takes over.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
