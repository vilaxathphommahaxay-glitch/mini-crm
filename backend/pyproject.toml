[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]  # generated migrations

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# the local alembic/ migrations folder would otherwise make it look first-party
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
